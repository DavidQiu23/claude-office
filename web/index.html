<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Claude 辦公室</title>
  <style>
    html { background: #1a1726; }
    /* body 是直向 flex：狀態列取自己的高度，大樓 flex:1 補滿剩下的視窗高（不必量狀態列） */
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #1a1726; color: #eee; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
    /* 狀態列：圖例＋比例條，外框跟著最緊急的狀態變色；配色與場景名牌一致 */
    #top { position: sticky; top: 0; z-index: 20; padding: 12px 16px 10px 56px; background: #1a1726; }
    #summary { padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 6px;
      background: #2b2840; border: 2px solid #8a7fc4; border-radius: 4px; box-shadow: 3px 3px 0 #0007; }
    #summary.turn { border-color: #f2b83d; }
    #summary.alert { background: #3a2233; border-color: #ff6b6b; }
    #summary .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 15px; }
    #summary .legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    #summary .legend b { font-size: 17px; font-variant-numeric: tabular-nums; }
    #summary .legend .waiting, #summary .legend .idle { font-weight: bold; }
    #summary i { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 2px solid; border-radius: 2px;
      font: normal 900 11px/1 system-ui, sans-serif; box-shadow: 1px 1px 0 #0007; }
    #summary .waiting i, #summary .bar .waiting { background: #d63434; border-color: #d63434; color: #fff; }
    #summary .idle i, #summary .bar .idle { background: #f2b83d; border-color: #f2b83d; color: #2b1d00; }
    #summary .working i, #summary .bar .working { background: #46d983; border-color: #46d983; color: #0b2a1a; }
    #summary .legend .zero { color: #a9a3c9; font-weight: normal; }
    #summary .zero i { background: transparent; border-color: #5a5480; color: #a9a3c9; box-shadow: none; }
    #summary .total { margin-left: auto; font-size: 14px; color: #a9a3c9; }
    #summary .bar { display: flex; gap: 2px; height: 8px; padding: 2px; background: #14121f; border-radius: 2px; }
    #summary .bar span { border-radius: 1px; }
    [hidden] { display: none !important; }
    /* 剖面大樓：上方夜空、樓層（最高樓在上）、下方地面；樓層左邊留 56 給電梯面板、右邊距 16 */
    #building { flex: 1 0 auto; display: flex; flex-direction: column; overflow-anchor: none; } /* 錨定由 building.ts 自己做（瀏覽器在 scrollY 0 不錨定） */
    #building .sky { flex: 1 0 48px; background-color: #120f22;
      background-image: radial-gradient(1px 1px at 18px 22px, #fff9, transparent), radial-gradient(1px 1px at 77px 61px, #fff6, transparent),
        radial-gradient(1.5px 1.5px at 131px 14px, #fffa, transparent), linear-gradient(#0b0a16, #1a1730);
      background-size: 160px 90px, 160px 90px, 160px 90px, auto; }
    #building .floors { padding: 0 16px 0 56px; background: #1a1730; }
    #building .ground { height: 72px; background: linear-gradient(#3a3850 0 6px, #2a2838 6px 30px, #22202d 30px); }
    /* 一層樓：高 200（含 8 樓板）；外層不捲，暗影與邊緣提示疊在上面；內容比可用寬寬時 .floor-scroll 自己左右捲 */
    .floor { position: relative; height: 200px; }
    .floor-scroll { height: 200px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    /* 兩側暗影 22px（那一側還有內容才顯示）；提示垂直置中在人物那排（y 74~158），貼可見範圍左右緣 */
    .shade { position: absolute; top: 0; width: 22px; height: 192px; pointer-events: none; z-index: 2; }
    .shade.left { left: 0; background: linear-gradient(90deg, #0a0814b3, #0a081400); }
    .shade.right { right: 0; background: linear-gradient(270deg, #0a0814b3, #0a081400); }
    .edge-hint { position: absolute; top: 102px; z-index: 3; height: 28px; padding: 0 11px; border: 0; border-radius: 14px; cursor: pointer; white-space: nowrap;
      font: bold 13px/28px system-ui, "Microsoft JhengHei", sans-serif; box-shadow: 0 2px 6px #0008; }
    .edge-hint.left { left: 6px; }
    .edge-hint.right { right: 6px; }
    .edge-hint.waiting { background: #d63434; color: #fff; }
    .edge-hint.idle { background: #f2b83d; color: #2b1d00; }
    .edge-hint:hover { filter: brightness(1.12); }
    .floor-in { position: relative; height: 200px; min-width: 100%; }
    .floor-in > div { position: absolute; }
    .wall { left: 0; right: 0; top: 0; height: 136px; background: linear-gradient(#41477a, #3a3f6d); box-shadow: inset 0 -3px 0 #2a2c4d; }
    .ground-strip { left: 0; right: 0; top: 136px; height: 56px; background: linear-gradient(#2a2d50, #30335a); }
    .slab { left: 0; right: 0; top: 192px; height: 8px; background: #14121f; }
    .elevator { left: 0; top: 0; width: 80px; height: 192px; background: #33375e; }
    .elevator .door-num { position: absolute; left: 26px; top: 20px; width: 28px; height: 16px; border-radius: 3px; background: #14121f;
      color: #ff9b6b; font: bold 11px/16px system-ui, "Microsoft JhengHei", sans-serif; text-align: center; }
    .elevator .door { position: absolute; left: 14px; top: 44px; width: 52px; height: 92px; box-sizing: border-box; border: 2px solid #2a2d4d; border-bottom: 0;
      border-radius: 2px 2px 0 0; overflow: hidden; background: linear-gradient(#e8d6a2, #a88f5c); }
    /* 兩片門往左右滑進牆裡（300ms，同 floor.ts 的 DOOR_MS），露出亮著的車廂；中間 2px 門縫 */
    .elevator .door::before, .elevator .door::after { content: ''; position: absolute; top: 0; bottom: 0; width: 50%; background: #5d6496; transition: transform .3s ease-in-out; }
    .elevator .door::before { left: 0; box-shadow: inset -1px 0 0 #3d4270; }
    .elevator .door::after { right: 0; box-shadow: inset 1px 0 0 #3d4270; }
    .elevator.open .door::before { transform: translateX(-100%); }
    .elevator.open .door::after { transform: translateX(100%); }
    .elevator.snap .door::before, .elevator.snap .door::after { transition: none; }
    /* 招牌：專案色（不透明度 0.9 由程式加在色碼後）、白色粗體，放不下用「…」 */
    .sign { left: 92px; top: 18px; max-width: 260px; height: 26px; padding: 0 12px; border-radius: 13px; box-sizing: border-box;
      color: #fff; font: bold 15px/26px system-ui, "Microsoft JhengHei", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 0 #0005; }
    .people, .desks { inset: 0; pointer-events: none; }
    .person { position: absolute; top: 74px; width: 60px; height: 84px; pointer-events: auto; }
    .person .fig { position: absolute; inset: 0; }
    .person img, .person canvas, .desk img { position: absolute; display: block; }
    .person[data-act="up"] .fig { transform: translateY(-12px); }
    .person[data-act="idle"] .fig { animation: bob .9s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(1.5px); } }
    .desk { position: absolute; top: 0; width: 120px; height: 200px; }
    /* 名牌：桌子正面，13px、最寬 112，放不下用「…」；卡片色同舊畫面的 PLATE_COLORS */
    .plate { position: absolute; top: 150px; left: 4px; right: 4px; display: flex; justify-content: center; }
    .plate > span { max-width: 112px; box-sizing: border-box; height: 19px; padding: 0 7px; border: 1px solid; border-radius: 3px;
      font: bold 13px/17px system-ui, "Microsoft JhengHei", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: inset 0 2px 0 #ffffff55, 0 2px 3px #0006; }
    .plate.working > span { background: #f3e9d6; border-color: #d8c7aa; color: #3b2f2a; }
    .plate.waiting > span { background: #d63434; border-color: #a82a2a; color: #ffffff; }
    .plate.idle > span { background: #f2b83d; border-color: #c9952c; color: #2b1d00; }
    .plate.assistant > span, .plate.done > span { background: #cfe0f7; border-color: #a9c1e4; color: #1f3550; }
    .plate.done > span { opacity: .75; }
    /* 電梯面板：固定在視窗左側垂直置中，寬 40，疊在狀態列之上（狀態列左邊 56 是空的）、資訊卡之下；樓層多到放不下時自己上下捲。按鈕直徑 28、間距 6；框上下各比按鈕多 3 */
    #elevator { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); z-index: 25; width: 40px; box-sizing: border-box; max-height: calc(100vh - 24px);
      overflow-y: auto; scrollbar-width: none; background: #14121fd9; border: 1px solid #3a3850; border-radius: 20px; box-shadow: 0 2px 8px #0008; }
    .elev-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 5px; }
    .elev-in button { flex: none; width: 28px; height: 28px; padding: 0; border: 2px solid #3a3850; border-radius: 50%; background: #25223a; color: #8f8bb0;
      font: bold 12px/1 system-ui, "Microsoft JhengHei", sans-serif; cursor: pointer; }
    .elev-in button:hover { border-color: #8a7fc4; color: #eee; }
    .elev-in button.waiting { background: #d63434; border-color: #ff8a8a; color: #fff; box-shadow: 0 0 8px #d63434; }
    .elev-in button.idle { background: #f2b83d; border-color: #ffd97a; color: #2b1d00; box-shadow: 0 0 8px #f2b83d99; }
    .elev-frame { position: absolute; left: 1px; right: 1px; box-sizing: border-box; border: 2px solid #ffffffaa; border-radius: 17px; background: #ffffff1f; pointer-events: none; }
    /* 沒有人上班：空大廳 */
    .lobby-msg { left: 80px; right: 0; top: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #aab0d0; font-size: 13px; text-align: center; }
    .lobby-msg b { font-size: 16px; color: #d4d8f0; }
  </style>
</head>
<body>
  <header id="top"><div id="summary"></div></header>
  <nav id="elevator" aria-label="電梯"></nav>
  <div id="building"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
