<script>
// ── V1.4 桌子與映像管：重畫 4 種桌子的 symbol。尺寸 112×88、畫面範圍（捲動的程式碼疊在這裡）、名牌區、馬克杯（煙）的位置都不變 ──
(() => {
  const st = (f, extra = '') => `style="fill:${f}${extra ? ';' + extra : ''}"`;
  const R = (x, y, w, h, rx, cls, f, extra) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const C = (cx, cy, r, cls, f, extra) => `<circle cx="${cx}" cy="${cy}" r="${r}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const E = (cx, cy, rx, ry, cls, f, extra) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const P = (d, cls, f, extra) => `<path d="${d}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const L = (d, cls, extra = '') => `<path d="${d}" class="${cls}" style="fill:none${extra ? ';' + extra : ''}"/>`;
  const riv = (x, y) => C(x, y, 1.3, 'mk-thin', '#fff8e8', 'stroke-width:.8');
  const g = (style, s) => `<g style="${style}">${s}</g>`;
  const SCR = { x: 19, y: -84, w: 29, h: 24 };
  const NAVY = '#1f3a66';
  const SCREEN = { empty: NAVY, working: NAVY, waiting: NAVY, idle: 'var(--screen-turn)' };

  function desk(state) {
    const lit = state !== 'empty';
    let o = '';
    // 檯燈：白天也看得到（燈罩是關著的冷灰），夜晚亮起；燈的光暈照舊由 .desk .glow 疊
    if (lit) {
      const arm = L('M-48 -48.5 V-61', 'mk', 'stroke-width:1.6') + E(-48, -49.5, 5, 1.6, 'mk-thin', '#a5a8b2');
      const shadePath = 'M-55 -61 Q-55 -71 -48 -71 Q-41 -71 -41 -61Z';
      o += arm + g('opacity:var(--day)', P(shadePath, 'mk', '#cfd6de') + P('M-45 -70.4 Q-41 -68 -41 -61 L-45 -61Z', '', '#b5bfca'))
        + g('opacity:var(--night)', P(shadePath, 'mk', '#fff3c4') + L('M-54 -61 H-42', 'mk-thin', 'stroke:#fff;stroke-width:1.4;opacity:.9'));
    }
    // 映像管：頂面一條（看得到一點上方，交代厚度）、外殼、內框、畫面、下巴上的小銘牌和電源燈（青色，不用狀態色）、旋鈕
    o += R(24, -56, 22, 5, 2, 'mk-thin', '#cfd2d8') + R(20, -52.5, 30, 3.5, 1.75, 'mk-thin', '#bfc3ca')
      + P('M18 -87 L23 -91 H49 L54 -87Z', 'mk', '#f3efe6') + L('M28 -89 h4 M35 -89 h4 M42 -89 h4', 'mk-thin', 'stroke-width:.9')
      + R(16, -87, 38, 33, 9, 'mk', '#e9e4d8') + R(48.5, -84.5, 4, 28, 2, '', '#c8c0ae')
      + R(17.5, -85.5, 32.5, 28.5, 7, 'mk-thin', '#ddd7c9')
      + R(SCR.x, SCR.y, SCR.w, SCR.h, 5, 'mk-thin', SCREEN[state])
      + R(22, -58.2, 9, 2.4, 1, 'mk-thin', '#c8c0ae') + C(45, -57, 1.4, 'mk-thin', lit ? '#9fe6ff' : '#9aa3ab') + C(40.5, -57, 1.3, 'mk-thin', '#cfc8b8');
    // 便利貼：貼在外殼右上角（離人臉遠一點），淺薄荷色（不用黃色：太接近琥珀）
    if (lit) o += `<g transform="rotate(10 55 -82)">${R(51, -87, 8, 8, .8, 'mk-thin', '#c9f0dc')}${L('M53 -84 h4 M53 -81.5 h3', 'mk-thin', 'stroke-width:.7')}</g>`;
    if (state === 'empty') o += L(`M${SCR.x + 9} ${SCR.y + 14} q5.5 -5 11 0`, 'mk-thin', 'stroke:#7ab0ff;stroke-width:1.6;opacity:.7');
    if (state === 'waiting') o += `<g class="dialog">${R(SCR.x + 4, SCR.y + 4, 21, 16, 1.5, 'mk-thin', '#fff')}${R(SCR.x + 4, SCR.y + 4, 21, 4, 1, '', 'var(--screen-waiting)')}${R(SCR.x + 6.5, SCR.y + 13.5, 7, 3, 1, '', '#5cba69')}${R(SCR.x + 15.5, SCR.y + 13.5, 7, 3, 1, '', '#c9c2b6')}</g>`;
    if (lit) o += L(`M${SCR.x + 3.5} ${SCR.y + 5} q3.5 -2.5 8.5 -2.5`, 'mk-thin', 'stroke:#fff;stroke-width:1.6;opacity:.55');
    // 桌上：馬克杯（位置不變，輪到你時冒煙）、鍵盤（一排鍵）、滑鼠
    o += R(-40, -57, 9, 8.5, 3, 'mk-thin', '#fff') + L('M-31 -55 q3 0 3 2.5 q0 2.5 -3 2.5', 'mk-thin')
      + R(-16, -52, 32, 3.5, 1.2, 'mk-thin', '#f2f2f2') + L('M-13 -50.3 h2 M-9 -50.3 h2 M-5 -50.3 h2 M-1 -50.3 h2 M3 -50.3 h2 M7 -50.3 h2 M11 -50.3 h2', 'mk-thin', 'stroke-width:.8')
      + E(20, -50, 3, 1.6, 'mk-thin', '#f2f2f2');
    // 桌子本體：我們看到的是桌子正面的擋板（人坐在後面，抽屜和放腳的空間朝著他）。
    // 桌面有前緣厚度和右側硬影；正面 y −42 到 −23 留白給名牌；底下一條細飾條、右側一階硬影、兩端一對桌腳
    o += R(-56, -48.5, 112, 46, 8, 'mk', 'var(--desk)') + R(36, -39, 15, 33, 5, '', 'var(--desk-shade)')
      + L('M-50 -14 H50', 'mk-thin', 'stroke-width:1;opacity:.55')
      + R(-53, -4, 10, 4, 1.5, 'mk-thin', '#a5a8b2') + R(43, -4, 10, 4, 1.5, 'mk-thin', '#a5a8b2')
      + R(-56, -48.5, 112, 8, 4, 'mk', 'var(--desk-top)') + R(-55, -42.6, 110, 2.2, 0, '', 'color-mix(in srgb, var(--desk-shade) 45%, var(--desk-top))') + R(40, -47.5, 14, 6, 2.5, '', 'color-mix(in srgb, var(--desk-shade) 60%, var(--desk-top))')
      + riv(-50, -9) + riv(50, -9);
    return o;
  }
  for (const s of ['empty', 'working', 'waiting', 'idle']) { const el = document.getElementById(`desk-${s}`); if (el) el.innerHTML = desk(s); }
})();
</script>
