<style>
/* ── 第 14 層：夜晚的燈光、電梯燈、天際線、桌角、名牌斷行、寬畫面 ── */

/* 夜晚的房間：燈是亮著的。室內的遮罩換成暖褐（奶油牆壓下來是暖米色，HSV 彩度約 .3，不會撞琥珀），外牆柱和樓板維持深藍，建築外面才暗得下來 */
:root[data-time="night"] .floor-in::after {
  background: linear-gradient(var(--night-shade), var(--night-shade)) 0 192px / 100% 8px no-repeat,
    linear-gradient(90deg, var(--night-shade) 0 12px, #6b4a3a 12px calc(100% - 12px), var(--night-shade) calc(100% - 12px)) !important; }

/* 夜晚等你處理的人和他的桌子疊到遮罩上面，用白天的亮度：整層樓最亮的一格就是等你的人。
   紅光（.seat-halo）在遮罩上、人的後面，只映在牆上，不蓋住臉 */
:root[data-time="night"] .person[data-act="up"]:not([data-fx]) { z-index: 3; }
:root[data-time="night"] .desk[data-st="waiting"] { z-index: 3; }
:root[data-time="night"] .sign { z-index: 4; }
.person .glow, .desk[data-st="waiting"] .glow { display: none !important; }
.floor-in > .seat-halo { display: none; top: 2px; width: 230px; height: 190px; margin-left: -115px; z-index: 2; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(closest-side, rgb(214 52 52 / .78), rgb(214 52 52 / .34) 58%, transparent); }
:root[data-time="night"] .floor-in > .seat-halo { display: block; }

/* 桌燈和螢幕的光收小收淡：照亮桌面就好，不再蓋到臉 */
.desk .glow { --mon: rgb(159 208 255 / .26) !important;
  background: radial-gradient(circle 44px at 153.5px 118px, var(--mon), transparent), radial-gradient(circle 28px at 72px 126px, rgb(255 243 196 / .5), rgb(255 240 184 / .18) 45%, transparent) !important; }
.desk[data-st="idle"] .glow { --mon: color-mix(in srgb, var(--screen-turn) 42%, transparent) !important; }
.floor-in > .ceil-glow { background: radial-gradient(48px 66px at 50% 0, rgb(255 248 226 / .16), rgb(255 244 214 / .04) 60%, transparent 74%) !important; }

/* 電梯燈：畫面外唯一的訊號。亮著的燈不要金屬框和內側陰影，整顆就是狀態色；沒亮的是凹下去的鋼色，亮和不亮一眼分開 */
.elev-in { padding-inline: 3px !important; gap: 5px !important; }
.elev-in button { position: relative; z-index: 1; /* 凹槽（.elev-frame）是定位元素，不抬上來會蓋住燈，所有看得到的樓層都暗 14% */ width: 30px !important; height: 30px !important; font: 800 12px/1 system-ui, "Microsoft JhengHei", sans-serif !important;
  background: #cfd5db !important; color: #3a4148 !important; border: 1.4px solid #6b7480 !important; box-shadow: inset 1.5px 2px 0 rgb(27 23 22 / .18) !important; }
.elev-in button:hover { border-width: 2.4px !important; }
.elev-in button.waiting { background: var(--waiting) !important; color: #fff !important; font-size: 14px !important; font-weight: 900 !important; border: 2.2px solid var(--ink) !important; box-shadow: 0 0 0 2px #fff !important; }
.elev-in button.idle { background: var(--turn) !important; color: #4a3000 !important; font-size: 13px !important; border: 1.8px solid var(--ink) !important; box-shadow: 0 0 0 1.5px #fff !important; }
:root[data-time="night"] .elev-in button.waiting { box-shadow: 0 0 0 2px #fff, 0 0 10px 3px rgb(214 52 52 / .85) !important; }

/* 天際線不再懸空：左右留白是隔壁棟的外牆，一路接到地面，上緣一條墨線，右側一階硬影；夜晚電梯面板壓在它上面也清楚 */
#building .floors { position: relative; }
#building .floors::before, #building .floors::after { content: ""; position: absolute; top: 0; bottom: 0; box-sizing: border-box; border-top: 1.4px solid var(--ink); pointer-events: none; }
#building .floors::before { left: 0; width: 44px;
  background: conic-gradient(at 5px 7px, transparent 75%, var(--sk-pane) 0) 7px 9px / 14px 18px, linear-gradient(90deg, var(--sk-near) 0 70%, var(--sk-near-shade) 70%); }
#building .floors::after { right: 0; width: 4px; background: var(--sk-near); }

/* 名牌兩行時平均分配，不留單字一行 */
.plate > span .txt { text-wrap: balance; }

/* 寬畫面的中段：窗和窗之間輪流放掛畫和靠牆的家具。都貼著後牆、在桌子後面，桌子長到這裡時讓開 */
.floor-in > .midfurn { inset: 0; pointer-events: none; }
.midfurn > .obj { filter: var(--drop); }
.midfurn .glow-floorLamp { top: 6px; width: 132px; height: 132px; margin-left: -66px; background: radial-gradient(closest-side, rgb(255 243 196 / .7), rgb(255 240 184 / .3) 35%, transparent); }
:root[data-time="night"] .midfurn .glow { display: block; }
</style>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const floors = [...document.querySelectorAll('.floor-in')];

  // 夜晚的紅光：每個等你處理的座位一片，掛在樓層上（人物疊到遮罩上之後，光要留在根的疊層才 screen 得到牆）
  for (const inner of floors) for (const d of inner.querySelectorAll('.desk[data-st="waiting"]')) {
    const h = document.createElement('div');
    h.className = 'seat-halo';
    h.style.left = `${parseFloat(d.style.left) + 60}px`;
    inner.insertBefore(h, inner.querySelector('.chairs'));
  }

  // 電梯的目前視野框：燈變大了，照按鈕重算
  const btns = [...document.querySelectorAll('.elev-in button')], fr = document.querySelector('.elev-frame');
  if (fr && btns.length) { const a = btns[0], z = btns[btns.length - 1]; fr.style.top = `${a.offsetTop - 3}px`; fr.style.height = `${z.offsetTop + z.offsetHeight - a.offsetTop + 6}px`; }

  // 中段：只有放得下第三扇窗的寬畫面才有（900 寬的畫面完全不變）
  const size = (id) => { const [, , w, h] = document.getElementById(id).getAttribute('viewBox').split(' ').map(Number); return { w, h }; };
  const overlay = (id) => document.querySelector(`.furniture .obj[data-id="${id}"] .anim`);
  const obj = (id, x) => {
    const { w, h } = size(id), svg = document.createElementNS(NS, 'svg'), use = document.createElementNS(NS, 'use');
    svg.setAttribute('class', 'obj'); svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('aria-hidden', 'true');
    svg.style.left = `${x - w / 2}px`; svg.style.top = `${156 - h}px`;
    use.setAttribute('href', `#${id}`); use.setAttribute('width', w); use.setAttribute('height', h); svg.append(use);
    const anim = overlay(id); if (anim) svg.append(anim.cloneNode(true));
    return svg;
  };
  const GROUPS = [['bookshelf', 'bookshelf'], ['sofa', 'floorLamp'], ['copier', 'waterCooler'], ['vending', 'plant'], ['sideTable', 'floorLamp']];
  const arts = [...document.querySelectorAll('.floor-in > .art')];
  floors.forEach((inner, fi) => {
    const wins = [...inner.querySelectorAll('.windows .glow')].map((g) => parseFloat(g.style.left));
    if (wins.length < 3) return;
    const seatEnd = 24 + 120 * inner.querySelectorAll('.desk').length, mid = document.createElement('div');
    mid.className = 'midfurn';
    for (let j = 1; j < wins.length - 1; j++) {
      const x = (wins[j] + wins[j + 1]) / 2;
      if (j % 2 === 0) {
        const a = arts[(fi + j) % arts.length].cloneNode(true);
        a.style.left = `${x}px`;
        inner.insertBefore(a, inner.querySelector('.chairs'));
        continue;
      }
      const group = GROUPS[(fi * 2 + j) % GROUPS.length], gap = 12, total = group.reduce((t, id) => t + size(id).w, 0) + gap * (group.length - 1);
      if (x - total / 2 < seatEnd + 20) continue; // 桌子長到這裡就讓開
      let left = x - total / 2;
      const rug = group.includes('sofa') && document.querySelector('.floor-in > .rug');
      if (rug) { const r = rug.cloneNode(true); r.style.left = `${x - 75}px`; inner.insertBefore(r, inner.querySelector('.chairs')); }
      for (const id of group) {
        const { w } = size(id);
        mid.append(obj(id, left + w / 2));
        if (id === 'floorLamp') { const g = document.createElement('div'); g.className = 'glow glow-floorLamp'; g.style.left = `${left + w / 2}px`; mid.append(g); }
        left += w + gap;
      }
    }
    inner.insertBefore(mid, inner.querySelector('.chairs'));
  });
})();
</script>
