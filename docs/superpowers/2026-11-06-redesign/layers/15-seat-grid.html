<style>
/* ── 第 15 層：固定格線。每層依寬度排好固定的格子，家具和桌子混排，桌子不再把家具推走 ── */
.floor-in > .furniture { right: auto; }
/* 空桌的椅子調淡：一整排亮藍椅子比坐著的人還搶眼。人來了就變回原本的藍 */
.chairs > .obj.vacant { filter: saturate(.3) brightness(1.1); }
</style>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const DESK = 120, BAY_MIN = 180, MODULE = 3 * DESK + BAY_MIN, EDGE = 24;
  const SETS = { pantry: ['waterCooler', 'vending', 'plant'], library: ['bookshelf', 'copier', 'plant'], lounge: ['floorLamp', 'sofa', 'sideTable'], reading: ['bookshelf', 'sideTable', 'floorLamp'] };
  const ORDER = ['lounge', 'library', 'pantry', 'reading']; // 示意：實作時第一組照舊依 roomKey 雜湊，之後依序輪
  const size = (id) => { const [, , w, h] = document.getElementById(id).getAttribute('viewBox').split(' ').map(Number); return { w, h }; };
  const anim = {}; for (const a of document.querySelectorAll('.furniture .obj .anim')) anim[a.closest('.obj').dataset.id] ??= a;
  const arts = [...document.querySelectorAll('.floor-in > .art')].slice(0, 3).map((a) => a.cloneNode(true));
  const rugT = document.querySelector('.floor-in > .rug')?.cloneNode(true);
  const obj = (id, x) => {
    const { w, h } = size(id), svg = document.createElementNS(NS, 'svg'), use = document.createElementNS(NS, 'use');
    svg.setAttribute('class', 'obj'); svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('aria-hidden', 'true');
    svg.style.left = `${x - w / 2}px`; svg.style.top = `${156 - h}px`; svg.dataset.id = id;
    use.setAttribute('href', `#${id}`); use.setAttribute('width', w); use.setAttribute('height', h); svg.append(use);
    if (anim[id]) svg.append(anim[id].cloneNode(true));
    return svg;
  };
  const floors = [...document.querySelectorAll('.floor-in')];
  floors.forEach((inner, fi) => {
    const level = floors.length - fi, chairsBox = inner.querySelector('.chairs'), before = () => inner.querySelector('.chairs');
    const U = inner.clientWidth - 2 * EDGE, bays = Math.max(1, Math.floor(U / MODULE)), nDesk = Math.floor((U - bays * BAY_MIN) / DESK), bayW = (U - nDesk * DESK) / bays;
    // 格子：三張桌子接一組家具，餘數平均給家具區
    let x = EDGE, left = nDesk, b = bays; const seats = [], groups = [], bayRects = [];
    while (left > 0 || b > 0) {
      const n = Math.min(3, left), g = [];
      for (let i = 0; i < n; i++) { seats.push(x + DESK / 2); g.push(x + DESK / 2); x += DESK; }
      if (g.length) groups.push(g);
      left -= n;
      if (b > 0) { bayRects.push({ x, w: bayW }); x += bayW; b--; }
    }
    // 拿掉舊的擺法
    for (const n of inner.querySelectorAll('.midfurn, .art, .sun, .seat-halo, .rug, .ceil-glow, .ceil .lamp')) n.remove();
    // 桌子、椅子、人：第 i 號座位對到第 i 格
    const desks = [...inner.querySelectorAll('.desk')], chairs = [...chairsBox.children];
    for (const p of inner.querySelectorAll('.person')) { const i = Math.round((parseFloat(p.style.left) - EDGE - DESK / 2) / DESK); p.style.left = `${seats[i]}px`; p.dataset.seat = i; }
    while (desks.length < nDesk) {
      const d = desks[0].cloneNode(true), plate = d.querySelector('.plate');
      d.dataset.st = 'empty'; d.querySelector('use').setAttribute('href', '#desk-empty'); plate.hidden = true; plate.className = 'plate'; plate.firstElementChild.textContent = '';
      inner.querySelector('.desks').append(d); desks.push(d);
      const c = chairs[0].cloneNode(true); chairsBox.append(c); chairs.push(c);
    }
    desks.forEach((d, i) => { d.style.left = `${seats[i] - DESK / 2}px`; chairs[i].style.left = `${seats[i] - 28}px`; chairs[i].classList.toggle('vacant', d.dataset.st === 'empty'); });
    // 窗和掛畫只開在桌子區的牆上，家具區留給高的家具
    const wins = inner.querySelector('.windows'), proto = wins.children[0].cloneNode(true); wins.replaceChildren();
    const addWin = (cx) => {
      const w = proto.cloneNode(true), svg = w.firstElementChild, l = Math.min(Math.max(level, 1), 5);
      svg.style.left = `${cx - 26}px`; w.querySelector('.glow').style.left = `${cx}px`;
      svg.firstElementChild.setAttribute('viewBox', `${((cx - 21) % 1440 + 1440) % 1440} ${260 - 42 - (l - 1) * 50} 42 42`);
      wins.append(w);
      const s = document.createElement('div'); s.className = 'sun'; s.style.left = `${cx}px`; inner.insertBefore(s, before());
    };
    let artN = fi;
    const addArt = (cx) => { const a = arts[artN++ % arts.length].cloneNode(true); a.style.left = `${cx}px`; inner.insertBefore(a, before()); };
    groups.forEach((g, gi) => {
      const c = (g[0] + g[g.length - 1]) / 2;
      if (gi === 0) { addWin(g[g.length - 1]); return; } // 第一組的左邊是招牌
      if (g.length >= 3) { addWin(c - DESK); addArt(c); addWin(c + DESK); }
      else if (g.length === 2) { addArt(c - DESK / 2); addWin(c + DESK / 2); }
      else addWin(c);
    });
    // 家具區
    const old = inner.querySelector('.furniture'), boxes = [];
    bayRects.forEach((r, k) => {
      const box = document.createElement('div'), items = SETS[ORDER[(fi + k) % ORDER.length]], gap = 12, total = items.reduce((t, id) => t + size(id).w, 0) + gap * (items.length - 1);
      box.className = 'furniture'; box.style.left = `${r.x}px`; box.style.width = `${r.w}px`; box.dataset.bay = k;
      let at = (r.w - total) / 2;
      for (const id of items) {
        const { w } = size(id), cx = at + w / 2;
        box.append(obj(id, cx));
        if (id === 'floorLamp' || id === 'vending') { const g = document.createElement('div'); g.className = `glow glow-${id}`; g.style.left = `${cx}px`; box.append(g); }
        if (id === 'sofa' && rugT) { const m = rugT.cloneNode(true); m.style.left = `${r.x + cx - 75}px`; inner.insertBefore(m, old); }
        at += w + gap;
      }
      boxes.push(box);
    });
    old.replaceWith(...boxes);
    inner.dataset.bays = JSON.stringify(bayRects);
    const hang = inner.querySelector('.hang'); if (hang) hang.style.left = `${bayRects[bayRects.length - 1].x + bayW - 40}px`;
    // 燈條跟著每個座位，夜晚柔光和紅光跟著移
    const ceil = inner.querySelector('.ceil');
    for (const cx of seats) {
      ceil.insertAdjacentHTML('beforeend', `<span class="lamp" style="left:${cx - 16}px"></span>`);
      const g = document.createElement('div'); g.className = 'ceil-glow'; g.style.left = `${cx}px`; inner.append(g);
    }
    desks.forEach((d, i) => { if (d.dataset.st !== 'waiting') return; const h = document.createElement('div'); h.className = 'seat-halo'; h.style.left = `${seats[i]}px`; inner.insertBefore(h, before()); });
  });
})();
</script>
