<style>
/* ── 人物精修：臉、髮型、比例都不動 ── */
/* 外輪廓再粗一點，和內線拉開層次 */
.person .figure .ol, .card-avatar .ol { stroke-width: 1.9; }
</style>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const rgb = (s) => (s.match(/\d+/g) || []).slice(0, 3).map(Number);
  const hex = (s) => s.startsWith('#') ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : rgb(s);
  const mix = (c, to, t) => { const a = hex(c), b = hex(to); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(' ')})`; };
  let n = 0;
  for (const svg of document.querySelectorAll('.person svg.figure, .card-avatar svg')) {
    const head = svg.querySelector('.head'), hair = head && head.querySelector('.hair');
    if (!head || !hair) continue;
    const id = `fc${Math.random().toString(36).slice(2, 7)}${n++}`;
    // 1. 瀏海在額頭上的影子：把前髮的形狀往右下挪一點，用皮膚的硬影色，只畫在臉的範圍裡
    const lock = hair.querySelector('path');
    // 毛帽（有帽緣 rect）：影子用帽緣的形狀，而且不加亮面——針織帽不會反光
    const brim = hair.querySelector('rect');
    if (lock) {
      const cp = mk('clipPath', { id }); cp.append(mk('ellipse', { cx: 30, cy: 22.5, rx: 17.2, ry: 16.2 }));
      const sh = mk('g', { 'clip-path': `url(#${id})` });
      sh.append(brim
        ? mk('rect', { x: +brim.getAttribute('x') + 1.8, y: +brim.getAttribute('y') + 3.2, width: brim.getAttribute('width'), height: brim.getAttribute('height'), rx: brim.getAttribute('rx'), style: 'fill:#f0b48e' })
        : mk('path', { d: lock.getAttribute('d'), transform: 'translate(1.8 3.2)', style: 'fill:#f0b48e' }));
      head.insertBefore(cp, hair); head.insertBefore(sh, hair);
      // 2. 頭髮左上一道亮面（同色調亮，硬邊）；戴帽子的不加
      const c = (lock.getAttribute('style') || '').match(/fill:([^;]+)/)?.[1]?.trim();
      if (!brim && c && !c.startsWith('var')) {
        const hl = `fill:${mix(c, '#ffffff', .42)}`;
        hair.append(mk('path', { d: 'M14.5 11 Q17 2 27 -.5 Q29 .5 27.5 1.5 Q20 4 17.5 12Z', style: hl }));
        const up = head.querySelector('.hair-up'); if (up) up.append(mk('path', { d: 'M13 8 L14 -3 L18 4Z M22 -10 L25 -1 L21 0Z', style: hl }));
      }
    }
    // 3. 腮紅：工作中和冥想的臉（爆氣不加），淡鮭魚色，不碰狀態紅
    for (const f of head.querySelectorAll('.face-work, .face-turn')) for (const x of [18.5, 41.5]) f.append(mk('ellipse', { cx: x, cy: 31, rx: 3, ry: 1.5, style: 'fill:#f4b8ad;opacity:.95' }));
    // 3b. 眼睛：工作中的瞳孔改成深色虹膜，加第二點高光
    for (const e of head.querySelectorAll('.face-work ellipse')) {
      const s = e.getAttribute('style') || '';
      if (s.includes('--fig-ink') && +e.getAttribute('rx') < 3) {
        e.setAttribute('style', 'fill:#2c2a4a');
        const cx = +e.getAttribute('cx'), cy = +e.getAttribute('cy');
        e.after(mk('circle', { cx: cx + 1, cy: cy + 1.4, r: .55, style: 'fill:#fff;opacity:.85' }));
      }
    }
    // 4. 衣服：兩側腋下的皺褶線
    const body = svg.querySelector('.body');
    if (body) body.append(mk('path', { d: 'M18.5 52 q2 3.5 1 8 M41.5 52 q-2 3.5 -1 8', class: 'mk-thin', style: 'fill:none;stroke-width:.9' }));
    // 4b. T 恤（領口只有一條弧線的那款）加一個胸前口袋
    if (body && body.querySelectorAll('path').length <= 3 && !body.querySelector('circle')) body.append(mk('path', { d: 'M34 50 h6 v5 q0 2 -2 2 h-2 q-2 0 -2 -2Z', class: 'mk-thin', style: 'fill:none;stroke-width:1' }));
    // 5. 袖口：每隻打字的手加一圈袖口線
    for (const a of svg.querySelectorAll('.arm')) { const r = a.querySelector('rect'); if (r) a.append(mk('path', { d: `M${+r.getAttribute('x') + .8} 63.5 h7.4`, class: 'mk-thin', style: 'fill:none;stroke-width:.9' })); }
  }
})();
</script>
