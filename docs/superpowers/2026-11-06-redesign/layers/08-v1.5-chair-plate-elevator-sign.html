<style>
/* ── V1.5 椅子、名牌、電梯面板、樓層招牌 ── */
/* 名牌：「!」「✓」前綴做成一顆圓章，字和顏色不變；高度多 1px，字距微開 */
.plate > span { height: 20px !important; line-height: 16px !important; display: inline-flex !important; align-items: center; gap: 3px; padding: 0 6px 0 5px !important; }
.plate > span .pb { flex: none; display: inline-grid; place-items: center; width: 12px; height: 12px; border-radius: 50%; font: 900 9px/1 system-ui, sans-serif; letter-spacing: 0; }
.plate.waiting > span .pb { background: #fff; color: var(--waiting); box-shadow: 0 0 0 1.2px var(--ink); }
.plate.idle > span .pb { background: #4a3000; color: var(--turn); }
.plate > span .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 樓層招牌：樓號的數字放大、F 縮小，像電梯裡的樓層牌 */
.sign .fl b { font-size: 16px; font-weight: 900; }
.sign .fl small { font-size: 10.5px; font-weight: 900; margin-left: 1px; }
/* 電梯面板：頂端一塊深色的上下箭頭顯示窗、上下各兩顆螺絲；按鈕外圈多一道刻線；目前視野改成凹下去的軌道 */
.elev-in { padding-top: 6px !important; padding-bottom: 12px !important; }
.elev-ind { flex: none; width: 26px; height: 16px; margin-bottom: 2px; box-sizing: border-box; border: 1.4px solid var(--ink); border-radius: 5px; background: #22304f; display: grid; place-items: center; }
.elev-ind svg { display: block; }
#elevator::before, #elevator::after { content: ""; position: absolute; left: 50%; width: 16px; height: 4px; margin-left: -8px; pointer-events: none;
  background: radial-gradient(circle 1.6px at 2px 2px, #fff 0 60%, #6b7480 62% 100%, transparent 100%), radial-gradient(circle 1.6px at 14px 2px, #fff 0 60%, #6b7480 62% 100%, transparent 100%); }
#elevator { position: fixed; }
#elevator::before { top: 3px; } #elevator::after { bottom: 3px; }
.elev-in button { box-shadow: 0 0 0 2px #fff, 0 0 0 3.4px #9aa4ad, inset 0 0 0 2px rgb(255 255 255 / .35), inset -2px -3px 0 rgb(0 0 0 / .16) !important; }
.elev-frame { border: 1.2px solid rgb(27 23 22 / .45) !important; background: color-mix(in srgb, var(--ink) 14%, transparent) !important; box-shadow: inset 2px 2px 0 rgb(27 23 22 / .2); }
</style>
<script>
(() => {
  // 椅子：椅背分出頭枕、靠墊加一圈縫線和兩顆釦、兩側扶手從人旁邊露出來；顏色和尺寸不變
  const st = (f, extra = '') => `style="fill:${f}${extra ? ';' + extra : ''}"`;
  const R = (x, y, w, h, rx, cls, f, extra) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const C = (cx, cy, r, cls, f, extra) => `<circle cx="${cx}" cy="${cy}" r="${r}"${cls ? ` class="${cls}"` : ''} ${st(f, extra)}/>`;
  const chair = document.getElementById('chair');
  if (chair) chair.innerHTML =
    R(-31, -22, 9, 7, 3, 'mk', '#3c66b3') + R(22, -22, 9, 7, 3, 'mk', '#3c66b3')
    + R(-27, -59, 54, 59, 14, 'mk', '#4f7fd6') + R(13, -55, 9, 51, 4.5, '', '#3c66b3')
    + R(-21, -56, 42, 9, 4.5, 'mk-thin', '#3c66b3') + R(9, -55, 10, 7, 3, '', '#335a9f')
    + R(-20, -45, 32, 36, 9, 'mk-thin', '#82a9ec') + R(-17, -42, 26, 30, 7, '', 'none', 'stroke:#e3edff;stroke-width:1;stroke-dasharray:2.5 2')
    + C(-21, -52, 1.3, 'mk-thin', '#fff8e8', 'stroke-width:.8') + C(21, -52, 1.3, 'mk-thin', '#fff8e8', 'stroke-width:.8');
  // 名牌：把前綴拆成圓章
  for (const sp of document.querySelectorAll('.plate > span')) {
    const t = sp.textContent, m = /^([!✓]) (.*)$/.exec(t), esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    // 文字一律包一層 .txt：截行放在內層，被截掉的下一行才不會從外層的 padding 露出來（card.ts 的 activity 同理）
    sp.innerHTML = m ? `<b class="pb" aria-hidden="true">${m[1]}</b><span class="txt">${esc(m[2])}</span>` : `<span class="txt">${esc(t)}</span>`;
  }
  // 招牌：樓號拆成數字和 F
  for (const fl of document.querySelectorAll('.sign .fl')) { const m = /^(\d+)F$/.exec(fl.textContent); if (m) fl.innerHTML = `<b>${m[1]}</b><small>F</small>`; }
  // 電梯面板：頂端的上下箭頭顯示窗
  const ein = document.querySelector('.elev-in');
  if (ein) ein.insertAdjacentHTML('afterbegin', `<div class="elev-ind" aria-hidden="true"><svg width="16" height="10" viewBox="0 0 16 10"><path d="M4 1 L7 5 H1Z" style="fill:#9fd0ff"/><path d="M12 9 L9 5 H15Z" style="fill:#9fd0ff;opacity:.45"/></svg></div>`);
  // 電梯的目前視野框跟著多出來的顯示窗往下移
  const fr = document.querySelector('.elev-frame'); if (fr) fr.style.top = `${parseFloat(fr.style.top) + 22}px`;
})();
</script>
