<style>
/* ── V1.2 辦公室精修 ── */
/* 掛畫：兩扇窗之間，墨線框、白色襯紙、右下硬影；每層一幅不同的畫，只用冷色和綠，不碰紅與琥珀 */
.floor-in > .art { top: 22px; width: 76px; height: 50px; margin-left: -38px; pointer-events: none; filter: drop-shadow(3px 3px 0 rgb(27 23 22 / .18)); }
.art svg { display: block; overflow: visible; }
/* 踢腳板：護牆板和地板之間一條深色收邊 */
.floor-in > .baseboard { left: 16px; right: 16px; top: 148px; height: 8px; box-sizing: border-box; border-top: 1.4px solid var(--ink); background: linear-gradient(#5f8f84 0 60%, #527e74 60%); pointer-events: none; }
/* 休息區地毯：只鋪在有沙發的那層，透視梯形、墨線框、一圈內框 */
.floor-in > .rug { top: 160px; height: 30px; pointer-events: none; }
.rug svg { display: block; overflow: visible; }
/* 垂吊盆栽：從天花板垂下來，掛在家具區上方的角落 */
.floor-in > .hang { top: 9px; width: 34px; height: 58px; pointer-events: none; }
.hang svg { display: block; overflow: visible; }
/* 夜晚：天花板燈條往下打一道柔光，比桌燈弱，不蓋過爆氣的紅光 */
.floor-in > .ceil-glow { display: none; top: 10px; width: 100px; height: 72px; margin-left: -50px; z-index: 2; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(48px 66px at 50% 0, rgb(255 248 226 / .24), rgb(255 244 214 / .07) 60%, transparent 74%); }
:root[data-time="night"] .floor-in > .ceil-glow { display: block; }
</style>
<script>
(() => {
  const INK = 'var(--ink)';
  const frame = (inner) => `<svg width="76" height="50" viewBox="0 0 76 50" aria-hidden="true">
    <rect x="1" y="1" width="74" height="48" rx="3" style="fill:#fff;stroke:${INK};stroke-width:1.8"/>
    <rect x="7" y="7" width="62" height="36" rx="1.5" style="fill:#dff1fb;stroke:${INK};stroke-width:1.3"/>${inner}
    <rect x="1" y="1" width="74" height="48" rx="3" style="fill:none;stroke:${INK};stroke-width:1.8"/></svg>`;
  const ARTS = [
    // 山和海
    frame(`<path d="M8 36 L24 18 L34 28 L44 14 L68 36 L68 42 L8 42Z" style="fill:#6f9a5e;stroke:${INK};stroke-width:1.2;stroke-linejoin:round"/>
      <path d="M44 14 L68 36 L58 36 Z" style="fill:#5b8450"/><path d="M8 37 H68 V42 H8Z" style="fill:#4f86b8;stroke:${INK};stroke-width:1.2"/>`),
    // 幾何：圓和方塊
    frame(`<circle cx="26" cy="25" r="11" style="fill:#8a74b0;stroke:${INK};stroke-width:1.2"/><rect x="38" y="14" width="22" height="22" rx="2" style="fill:#4a9a94;stroke:${INK};stroke-width:1.2"/>
      <path d="M49 14 H60 V36 H49Z" style="fill:#3d8580"/><path d="M12 38 H64" style="stroke:${INK};stroke-width:1.2"/>`),
    // 一片大葉子
    frame(`<path d="M18 38 C18 20 40 10 58 12 C56 30 40 40 18 38Z" style="fill:#7fbf7a;stroke:${INK};stroke-width:1.2;stroke-linejoin:round"/>
      <path d="M18 38 C30 30 42 22 54 15" style="fill:none;stroke:${INK};stroke-width:1.1;stroke-linecap:round"/><path d="M40 24 C46 30 52 24 56 16 C50 28 46 32 40 24Z" style="fill:#67a866"/>`),
  ];
  const rug = (w) => `<svg width="${w}" height="30" viewBox="0 0 ${w} 30" aria-hidden="true">
    <path d="M14 1 H${w - 14} L${w} 29 H0 Z" style="fill:#a9bcd9;stroke:${INK};stroke-width:1.6;stroke-linejoin:round"/>
    <path d="M${w * .72} 1 H${w - 14} L${w} 29 H${w * .76} Z" style="fill:#97acce"/>
    <path d="M22 6 H${w - 22} L${w - 12} 24 H12 Z" style="fill:none;stroke:#e9eef6;stroke-width:1.6;stroke-dasharray:5 4"/>
    <path d="M14 1 H${w - 14} L${w} 29 H0 Z" style="fill:none;stroke:${INK};stroke-width:1.6;stroke-linejoin:round"/></svg>`;
  const hang = `<svg width="34" height="58" viewBox="0 0 34 58" aria-hidden="true">
    <path d="M17 0 V14" style="stroke:${INK};stroke-width:1.3"/><path d="M8 20 L17 14 L26 20" style="fill:none;stroke:${INK};stroke-width:1.1"/>
    <path d="M6 20 H28 L25 31 H9 Z" style="fill:#e9edf2;stroke:${INK};stroke-width:1.5;stroke-linejoin:round"/><path d="M21 20 H28 L25 31 H19Z" style="fill:#c3cdd8"/>
    <path d="M9 30 C4 38 6 46 4 54" style="fill:none;stroke:#3f7a4c;stroke-width:1.6;stroke-linecap:round"/><path d="M25 30 C30 38 28 44 30 50" style="fill:none;stroke:#3f7a4c;stroke-width:1.6;stroke-linecap:round"/>
    ${[[5,36],[3,46],[6,53],[29,36],[30,44],[13,33],[22,34]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="2.8" style="fill:#7fbf7a;stroke:${INK};stroke-width:1.1"/>`).join('')}</svg>`;
  const add = (inner, cls, html, style, before) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; Object.assign(d.style, style); inner.insertBefore(d, before); };
  [...document.querySelectorAll('.floor-in')].forEach((inner, i, all) => {
    const w = inner.clientWidth, chairs = inner.querySelector('.chairs');
    const wins = [...inner.querySelectorAll('.windows .glow')].map((g) => parseFloat(g.style.left));
    if (wins.length >= 2) add(inner, 'art', ARTS[(all.length - 1 - i) % ARTS.length], { left: `${(wins[0] + wins[1]) / 2}px` }, chairs);
    add(inner, 'baseboard', '', {}, inner.querySelector('.boards').nextSibling);
    const furn = inner.querySelector('.furniture');
    if (furn.querySelector('[data-id="sofa"]')) add(inner, 'rug', rug(150), { left: `${w - 178}px` }, furn);
    if (i === 0) add(inner, 'hang', hang, { left: `${w - 66}px` }, chairs);
    for (const l of inner.querySelectorAll('.ceil .lamp')) add(inner, 'ceil-glow', '', { left: `${parseFloat(l.style.left) + 16}px` }, null);
  });
})();
</script>
