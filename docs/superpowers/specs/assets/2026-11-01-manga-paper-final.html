<!doctype html>
<html lang="zh-Hant">
<head>

<title>畫風定案示意圖</title>
<style>
body { margin: 0; padding: 16px; background: #f4f1ea; color: #333; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
h2 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
.subtitle { margin: 0 0 16px; color: #666; font-size: 14px; }
#wrap { display: grid; gap: 20px; max-width: 680px; }
.fin .p{transform-box:fill-box}.fin .arm{transform-origin:50% 8%}
.fin .work .arm-l{animation:ty .42s ease-in-out infinite}.fin .work .arm-r{animation:ty .42s ease-in-out .21s infinite}
@keyframes ty{50%{transform:translateY(-3px)}}
.fin .sfx{animation:fx .84s steps(1) infinite}@keyframes fx{50%{opacity:.25}}
.fin .wait .fig{transform:translateY(-12px)}.fin .wait .arm-r{animation:wave .8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(160deg)}50%{transform:rotate(195deg)}}
.fin .burst{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}@keyframes pop{50%{transform:scale(1.12)}}
.fin .lines{animation:fl 1.6s ease-in-out infinite}@keyframes fl{50%{opacity:.35}}
.fin .drop{animation:dr 1.6s ease-in infinite}@keyframes dr{0%{opacity:0;transform:translateY(-3px)}30%{opacity:1}100%{opacity:0;transform:translateY(5px)}}
.fin .turn .head{transform-origin:50% 90%;animation:nod 2.6s ease-in-out infinite}@keyframes nod{50%{transform:rotate(-6deg) translateY(1.5px)}}
.fin .z1{animation:zz 2.6s ease-out infinite}.fin .z2{animation:zz 2.6s ease-out 1.3s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.fin .blink{animation:bl 1.8s steps(1) infinite}@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.fin *{animation:none!important}}
</style>
</head>
<body>
<h2>畫風定案：手繪紙張背景＋日式漫畫人物</h2>

const PL={work:['P','#3b3020'],wait:[RED,'#fff'],turn:[AMB,'#4a3000'],sub:['#dfeedd','#2f4a32']};

  else{o+=`<circle cx="612" cy="84" r="14" fill="#f3e6b8" ${pk(1.4)}/><circle cx="619" cy="79" r="12" fill="${s.page}"/>`;[[90,80],[170,96],[250,74],[330,92],[420,82],[500,100],[540,72]].forEach(([x,y])=>o+=`<path d="M${x-3} ${y} h6 M${x} ${y-3} v6" stroke="#f1e9d8" stroke-width="1.2"/>`)}
